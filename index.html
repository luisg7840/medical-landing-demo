<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Título que aparece en la pestaña del navegador y en Google -->
    <title>Dr. Apellido | Atención Médica Integral en Maracay</title>

    <!-- Meta Descripción principal para buscadores (SEO) -->

    <!-- Open Graph: Configuración para vistas previas en WhatsApp, Facebook y LinkedIn -->

    <meta property="og:title" content="Dr. Apellido | Atención Médica en Maracay" />

    <meta property="og:image" content="/imagen-preview.jpg" />

    <!-- Tarjetas de Twitter (X) -->
    <meta name="twitter:card" content="summary_large_image" />
